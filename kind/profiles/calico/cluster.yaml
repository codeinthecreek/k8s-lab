# calico profile: 1 control-plane + 2 workers, same topology as default but
# with kindnetd disabled in favor of Calico (manifests/cni/calico.yaml,
# v3.32.1). Exists to test and demonstrate NetworkPolicy enforcement -
# kindnetd does not enforce NetworkPolicy at all, so a real policy-enforcing
# CNI is required here. See DESIGN.md's "kindnetd stays the default CNI on
# default and ha-control-plane" section for the swap-in steps this profile
# follows.
#
# podSubnet is deliberately left unset here, same as default and
# ha-control-plane. manifests/cni/calico.yaml has no CALICO_IPV4POOL_CIDR
# set, so calico-kube-controllers auto-creates its default-ipv4-ippool from
# each node's node.spec.podCIDR - which kubeadm assigns from kind's default
# pod-network-cidr (10.244.0.0/16) since this cluster.yaml doesn't override
# it. Verified against a real cluster: `kubectl get ippool -o yaml` shows
# default-ipv4-ippool at 10.244.0.0/16, and pods actually get IPs in that
# range - not Calico's commonly-cited 192.168.0.0/16 default, which only
# applies when CALICO_IPV4POOL_CIDR is explicitly set or podCIDR isn't
# available. Nothing to align here since there's only one CIDR in play.
#
# Node image is pinned by digest so `make up` produces the same node
# filesystem/kubeadm/kubelet/containerd bits every time, regardless of what
# "latest" resolves to on the day you run it. Version source: kind v0.32.0
# release notes (https://github.com/kubernetes-sigs/kind/releases/tag/v0.32.0).
#
# Cluster name is NOT set here on purpose - the Makefile always passes
# --name k8s-lab-calico on the CLI, and a CLI --name silently overrides
# whatever is in this file. Keeping it out avoids two sources of truth that
# can drift apart.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  # kindnetd does not enforce NetworkPolicy - that's the whole reason this
  # profile exists. manifests/cni/calico.yaml is applied first in
  # manifests.txt to take its place.
  disableDefaultCNI: true

nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    # Publishes the node container's 80/443 to the Docker host, and labels
    # this node so the ingress-nginx controller pod (see
    # manifests/ingress/ingress-nginx.yaml) is scheduled onto the node that
    # actually has those ports mapped, instead of landing on a worker where
    # the mapping wouldn't exist.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5

  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
