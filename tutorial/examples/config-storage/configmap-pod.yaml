# Consumes config-storage-demo-cm both ways at once - envFrom and a
# mounted volume - so the two can be compared directly. See
# docs/tutorial/04-config-storage.md.
apiVersion: v1
kind: Pod
metadata:
  name: config-storage-demo-cm-pod
  labels:
    app: config-storage-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    envFrom:
    - configMapRef:
        name: config-storage-demo-cm
    volumeMounts:
    - name: cm-vol
      mountPath: /etc/config
  volumes:
  - name: cm-vol
    configMap:
      name: config-storage-demo-cm
