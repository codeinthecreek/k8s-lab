# A Pod-scoped scratch volume - lives exactly as long as the Pod does,
# not any individual container. Deliberately writes nothing on start -
# see docs/tutorial/04-config-storage.md, which writes into it via
# `kubectl exec` instead, so a fresh Pod's empty volume is genuinely
# observable rather than immediately overwritten by the start command.
apiVersion: v1
kind: Pod
metadata:
  name: config-storage-demo-emptydir-pod
  labels:
    app: config-storage-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: scratch
      mountPath: /scratch
  volumes:
  - name: scratch
    emptyDir: {}
