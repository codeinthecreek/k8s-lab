# Mounts config-storage-demo-nfs-pvc. Requires nfs-common on the node
# it lands on - `make nfs-client-install PROFILE=default` first, or the
# mount fails with "mount.nfs: ... No such file or directory". See
# docs/tutorial/04-config-storage.md and
# lab-helpers/nfs-server/README.md.
apiVersion: v1
kind: Pod
metadata:
  name: config-storage-demo-nfs-pod
  labels:
    app: config-storage-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: nfs-vol
      mountPath: /mnt/nfs
  volumes:
  - name: nfs-vol
    persistentVolumeClaim:
      claimName: config-storage-demo-nfs-pvc
