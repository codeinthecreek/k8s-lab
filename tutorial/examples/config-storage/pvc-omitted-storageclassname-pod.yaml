# Consumes config-storage-demo-omitted-scn-pvc - needed to actually
# trigger binding, since the default StorageClass uses
# volumeBindingMode: WaitForFirstConsumer (nothing provisions until a
# Pod references the PVC). See docs/tutorial/04-config-storage.md.
apiVersion: v1
kind: Pod
metadata:
  name: config-storage-demo-omitted-scn-pod
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: vol
      mountPath: /mnt/data
  volumes:
  - name: vol
    persistentVolumeClaim:
      claimName: config-storage-demo-omitted-scn-pvc
