# Mounts config-storage-demo-secret as a volume rather than env vars -
# see docs/tutorial/04-config-storage.md for why volume mounting is the
# safer default for secrets (env vars leak into `kubectl exec ... env`,
# process listings, and crash dumps more easily than a mounted file).
apiVersion: v1
kind: Pod
metadata:
  name: config-storage-demo-secret-pod
  labels:
    app: config-storage-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: secret-vol
      mountPath: /etc/secret
      readOnly: true
  volumes:
  - name: secret-vol
    secret:
      secretName: config-storage-demo-secret
