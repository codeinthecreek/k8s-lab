# Same CRD as crontab-crd.yaml, minus the versions[].schema block -
# apply this one to confirm the apiserver rejects it outright rather
# than silently accepting an unvalidated type.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: crontabs.example.com
spec:
  group: example.com
  scope: Namespaced
  names:
    plural: crontabs
    singular: crontab
    kind: CronTab
    shortNames:
      - ct
  versions:
    - name: v1
      served: true
      storage: true
