# A CustomResourceDefinition registers a new API type - here,
# CronTab in the example.com group - the same way a Deployment or
# Service is registered, just defined by a manifest instead of
# compiled into the apiserver. openAPIV3Schema is mandatory under
# apiextensions.k8s.io/v1 (unlike the removed v1beta1, where it was
# optional) - see crontab-crd-no-schema.yaml for what happens without
# one.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: crontabs.example.com
spec:
  group: example.com
  scope: Namespaced
  names:
    plural: crontabs
    singular: crontab
    kind: CronTab
    shortNames:
      - ct
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                cronSpec:
                  type: string
                image:
                  type: string
                replicas:
                  type: integer
