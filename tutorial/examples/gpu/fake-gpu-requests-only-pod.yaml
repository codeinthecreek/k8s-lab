# Chapter 15 ("rules" section): only a request is written; the apiserver rejects it.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-requests-only
  namespace: gpu-demo
spec:
  containers:
  - name: main
    image: busybox:1.37
    command: ["sleep", "3600"]
    resources:
      requests:
        nvidia.com/gpu: 1
