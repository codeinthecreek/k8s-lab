# Chapter 17 (Pending): asks for two GPUs on a node that has one.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-two
  namespace: gpu-real
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
  - name: main
    image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
    resources:
      limits:
        nvidia.com/gpu: 2
