# Chapter 16 (node affinity): prefers (does not require) an A100 node. Applied first of two; see the -second file.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-aff-pref-first
  namespace: gpu-sched
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: nvidia.com/gpu.product
            operator: In
            values: ["A100-SXM4-40GB"]
  containers:
  - name: main
    image: busybox:1.37
    command: ["sleep", "3600"]
    resources:
      limits:
        nvidia.com/gpu: 1
