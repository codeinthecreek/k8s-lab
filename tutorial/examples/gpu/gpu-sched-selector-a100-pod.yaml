# Chapter 16 (nodeSelector): asks for one GPU on a node labeled nvidia.com/gpu.product=A100-SXM4-40GB (label applied by hand in the chapter).
apiVersion: v1
kind: Pod
metadata:
  name: gpu-sel-a100
  namespace: gpu-sched
spec:
  nodeSelector:
    nvidia.com/gpu.product: A100-SXM4-40GB
  containers:
  - name: main
    image: busybox:1.37
    command: ["sleep", "3600"]
    resources:
      limits:
        nvidia.com/gpu: 1
