# Chapter 16 (nodeSelector): a second one-GPU Pod for the same A100 node; the node advertises only one GPU, so this Pod waits.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-sel-a100-second
  namespace: gpu-sched
spec:
  nodeSelector:
    nvidia.com/gpu.product: A100-SXM4-40GB
  containers:
  - name: main
    image: busybox:1.37
    command: ["sleep", "3600"]
    resources:
      limits:
        nvidia.com/gpu: 1
