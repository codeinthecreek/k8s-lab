# Chapter 16 (taint): asks for one GPU and tolerates the nvidia.com/gpu:NoSchedule taint. No nodeSelector.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-toleration
  namespace: gpu-sched
spec:
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  containers:
  - name: main
    image: busybox:1.37
    command: ["sleep", "3600"]
    resources:
      limits:
        nvidia.com/gpu: 1
