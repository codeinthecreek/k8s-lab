# Chapter 18 (failRequestsGreaterThanOne): the same request as gpu-share-two, under a new name.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-share-two-strict
  namespace: gpu-real
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
  - name: main
    image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
    command: ["sleep", "3600"]
    resources:
      limits:
        nvidia.com/gpu: 2
