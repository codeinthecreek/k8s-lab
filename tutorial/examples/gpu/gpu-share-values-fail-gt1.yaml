# Chapter 18 (failRequestsGreaterThanOne): the same config as
# gpu-share-values.yaml, plus failRequestsGreaterThanOne: true.
config:
  map:
    default: |-
      version: v1
      sharing:
        timeSlicing:
          failRequestsGreaterThanOne: true
          resources:
          - name: nvidia.com/gpu
            replicas: 4
