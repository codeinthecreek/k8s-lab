apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling-profiles-spread-demo
spec:
  replicas: 6
  selector:
    matchLabels:
      app: scheduling-profiles-spread-demo
  template:
    metadata:
      labels:
        app: scheduling-profiles-spread-demo
    spec:
      schedulerName: default-scheduler
      containers:
      - name: busybox
        image: busybox
        command: ["sleep", "3600"]
        resources:
          requests:
            cpu: "1"
            memory: "64Mi"
