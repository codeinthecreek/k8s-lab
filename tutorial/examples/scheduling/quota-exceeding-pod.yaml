# limits.memory (600Mi) exceeds resourcequota.yaml's hard cap of
# 512Mi for the whole namespace - rejected even though this is the
# only Pod requesting anything so far.
apiVersion: v1
kind: Pod
metadata:
  name: scheduling-demo-exceeding-pod
  namespace: scheduling-demo-governance
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    resources:
      requests:
        cpu: "300m"
        memory: "300Mi"
      limits:
        cpu: "600m"
        memory: "600Mi"
