# requests == limits on every container gives QoS class Guaranteed. See
# docs/tutorial/06-scheduling.md.
apiVersion: v1
kind: Pod
metadata:
  name: scheduling-demo-qos-pod
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"
