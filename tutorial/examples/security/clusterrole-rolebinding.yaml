# Binds the cluster-scoped security-demo-cm-reader ClusterRole via a
# namespaced RoleBinding - this grants its permissions only inside
# `default`, not cluster-wide, despite the ClusterRole itself having no
# namespace. See docs/tutorial/09-security.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-demo-cm-reader-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: security-demo-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: security-demo-cm-reader
  apiGroup: rbac.authorization.k8s.io
