# Allows ingress to security-demo-target only from Pods labeled
# role=frontend. The API accepts this identically regardless of CNI -
# whether it's actually enforced is a separate question. See
# docs/tutorial/08-security.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: security-demo-netpol
spec:
  podSelector:
    matchLabels:
      app: security-demo-target
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: frontend
