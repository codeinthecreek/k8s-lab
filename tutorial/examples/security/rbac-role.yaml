# Grants read-only access to Pods in this namespace only - nothing
# else, no other resource type, no other API group. See
# docs/tutorial/08-security.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-demo-pod-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
