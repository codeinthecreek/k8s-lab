# Binds security-demo-pod-reader to security-demo-sa. See
# docs/tutorial/09-security.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-demo-pod-reader-binding
subjects:
- kind: ServiceAccount
  name: security-demo-sa
  namespace: default
roleRef:
  kind: Role
  name: security-demo-pod-reader
  apiGroup: rbac.authorization.k8s.io
