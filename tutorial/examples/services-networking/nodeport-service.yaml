# Exposes the same backend on every node's IP, on a fixed high port.
# See docs/tutorial/05-services-networking.md for why this isn't
# reachable at localhost:<nodePort> on the Docker host in kind.
apiVersion: v1
kind: Service
metadata:
  name: services-demo-nodeport
spec:
  type: NodePort
  selector:
    app: services-demo
  ports:
  - port: 80
    targetPort: 80
