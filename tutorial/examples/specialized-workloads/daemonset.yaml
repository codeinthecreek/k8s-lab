# One Pod per node rather than a replica count - see
# docs/tutorial/06-specialized-workloads.md's "DaemonSet" subsection.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: specialized-workloads-demo-ds
  labels:
    app: specialized-workloads-demo-ds
spec:
  selector:
    matchLabels:
      app: specialized-workloads-demo-ds
  template:
    metadata:
      labels:
        app: specialized-workloads-demo-ds
    spec:
      containers:
      - name: busybox
        image: busybox:1.36
        command: ["sh", "-c", "sleep 3600"]
