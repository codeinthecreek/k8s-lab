# A workload that runs to completion rather than staying up - see
# docs/tutorial/03-workloads.md's "workloads that run to completion"
# subsection.
apiVersion: batch/v1
kind: Job
metadata:
  name: workloads-demo-job
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: hello
        image: busybox:1.36
        command: ["sh", "-c", "echo Hello from the Job; sleep 5"]
